name: Release

# Every push to `main` or `2.0` either opens or updates a "Version Packages" pull
# request from the pending changesets. Once that pull request is merged, the next
# push publishes the versions that are not on npm yet. `main` publishes the stable
# release. `2.0` is in changesets pre mode, so it publishes prereleases under the
# `next` tag instead.
on:
  push:
    branches:
      - main
      - '2.0'

# Two releases running at once could both try to publish the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push release tags and create GitHub releases
  pull-requests: write # open the Version Packages pull request
  id-token: write # authenticate to npm through trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit because this job publishes to npm.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the full history and existing tags for the release tags that `changeset publish` creates.
          fetch-depth: 0

      # The pnpm version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # No `registry-url`. It writes an `.npmrc` that expects a token, and trusted publishing needs none.

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm fmt:check

      - run: pnpm lint

      - run: pnpm type-check

      - run: pnpm build

      # The tests run in a real browser through Playwright.
      - run: pnpm --filter solid-floating-ui exec playwright install --with-deps chromium

      - run: pnpm test

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm cs:ver
          publish-script: pnpm cs:pub
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

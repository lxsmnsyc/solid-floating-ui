name: CI
on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Type-check
        run: pnpm run type-check
        env:
          CI: true

      - name: Build
        run: pnpm run build
        env:
          CI: true

      - name: Install Playwright browsers
        run: pnpm --filter solid-floating-ui exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter solid-floating-ui run test:e2e
        env:
          CI: true

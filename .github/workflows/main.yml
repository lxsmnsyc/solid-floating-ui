name: CI
on:
  push:
    branches:
      - main
  pull_request:
    # A draft runs nothing. Pull requests stay drafts until their review is clean,
    # so CI runs once as the last gate before the merge.
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a pull request cancels the run of the push before it.
# Runs on pushes are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Type-check
        run: pnpm run type-check
        env:
          CI: true

      - name: Build
        run: pnpm run build
        env:
          CI: true

      - name: Install Playwright browsers
        run: pnpm --filter solid-floating-ui exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter solid-floating-ui run test:e2e
        env:
          CI: true
